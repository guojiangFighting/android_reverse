// [START declaration]
syntax = "proto3";
package proto;
import "mapdata-v2.proto";
import "mapdata_base.proto";

option java_package = "com.huawei.ads.uavp.servicecommon.bean.proto";
option java_outer_classname = "AvpMapProto";

// [END declaration]


// [START messages]

message AvpData {
  repeated sint32 floor = 1;
  repeated Road_ road = 2;
  repeated ParkingSpot_ parkingSpot = 3;
  repeated Obstacle_ obstacles = 4; // 障碍物:墙 柱子等
  repeated TollArea_ tollarea = 5; // 当前用于标记电梯口
  repeated ZoomOutDisplayConfig_ zoomOutDisplayConfig = 6; // 用于地图比例尺放大后,设置
  repeated Roadmarking_ roadmarking = 7; // 减速带
  repeated Lane_ lane = 8;

  repeated Road_ originRoad = 9;         // 来源于0.dat 矢量road

  sint32 groundLayer = 50; // ground layer
  repeated sint32 unmannedLayer = 51; // 支持无人AVP的楼层
  repeated sint32 splitArray = 52;

  string version = 100; // fusion vesion, AVP.xxx 来自latest-version.txt

  // old："unitedpatch"
  UnitedPatch unitedpatch = 300;                                     // 考虑兼容性，将一体化后的新规格在老规格的后面全部再加一遍。
}

message Road_ {
  repeated Point_ point = 1;
  int64 id = 2;
  repeated sint32 floor = 3;
  bool isBothway = 4;
}

message ParkingSpot_ {
  repeated Point_ point = 1;
  int64 id = 2;
  repeated sint32 floor = 3;
  uint32 parkAreaId = 4;          //  分区信息B1-B10对应(1-10) , F1-F10(对应11-20) ABC(21,22,23)
  int64 stopperId = 5;           //  车位号
  uint64 relatedRoadId = 6;       //  充电车位标识  1是充电车位，0不是充电车位
}

message Obstacle_ {
  int64 id = 1;         // ->  id +layer信息
  repeated Point_ points = 2;
  bool   traversable = 3;
  uint32 movable = 4;    // ->   1 墙  2 柱子
  repeated uint64 relatedIntersectionId = 5; // 关联的路口id
  repeated uint64 relatedLaneId = 6; // 关联的lane_id
  repeated sint32 floor = 7;
}

// TollArea废弃，由新增的AvpKeyPoint代替
message TollArea_ {
  int64 id = 1;    //  id +layer信息
  repeated Point_ points = 2;
  repeated uint64 inRoadId = 3;
  repeated uint64 outRoadId = 4;
  repeated sint32 floor = 5;
}

// Roadmarking废弃，由新增的减速带Bumper代替
message Roadmarking_ {
  int64 id = 1;     // id + layer
  repeated Point_ points = 2;  // 5个点
  uint32 type = 3;
  repeated uint64 relatedlaneId = 4;
  repeated sint32 floor = 5;
}

message Lane_ {
  repeated Point_ point =1;
  int64 id  = 2;
  double length = 3;
  repeated sint32 floor = 4;
  repeated uint64 prevLanesId = 5;
  repeated uint64 nextLanesId = 6;
  bool   isIntersectionLane = 7;
  uint64 intersectionId = 8;
  uint32 currentTurn = 9;
  repeated uint64 oppositeRoadsId = 10;
  uint32 roadType = 11;
}

message StopLine {
  int64 id = 1;      // id +layer信息
  repeated Point_ points = 2;      // 矩形的四个点（成环存5个）。
  uint32 Type = 3;
  repeated uint64 relatedLanesId = 4;
}

// [END messages]
